<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./styles.css" />
  
  <title>Frontend Mentor | Results summary component</title>

  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <div class="container">

    <main>

      <article>

        <div class="result">

          <header>
            <h1 class="left-title">Your Result</h1>
          </header>

          <section class="points">
            <h1>76</h1>
            <p>of 100</p>
          </section>

          <section class="evaluation-text">
            <h1>Great</h1>
            <p>You scored higher than 65% of the people who have taken these tests.
            </p>
          </section>

        </div>

      </article>

      <article>

        <div class="summary">

          <header>
            <h1 class="right-title">Summary</h1>
          </header>

          <section>

            <div class="reaction parameters">
              <figure>
                <img src="./assets/images/icon-reaction.svg" alt="thunder" />
              </figure>

              <div class="adjustment-box">
                <p>Reaction</p>
                <span>80 <span>/ 100</span></span>
              </div>
            </div>

            <div class="memory parameters">
              <figure>
                <img src="./assets/images/icon-memory.svg" alt="brain" />
              </figure>

              <div class="adjustment-box">
                <p>Memory</p>
                <span>92 <span>/ 100</span></span>
              </div>
            </div>

            <div class="verbal parameters">
              <figure>
                <img src="./assets/images/icon-verbal.svg" alt="chat cloud" />
              </figure>

              <div class="adjustment-box">
                <p>Verbal</p>
                <span>61 <span>/ 100</span></span>
              </div>
            </div>

            <div class="visual parameters">
              <figure><img src="./assets/images/icon-visual.svg" alt="eye" />
              </figure>

              <div class="adjustment-box">
                <p>Visual</p>
                <span>73 <span>/ 100</span></span>
              </div>
            </div>

          </section>

          <a href="#"><div class="continue">
            <p>Continue</p>
          </div></a>

        </div>

      </article>

    </main>

  </div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Łukasz Nowak</a>.
  </footer>

</body>
</html>
