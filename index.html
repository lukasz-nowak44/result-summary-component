<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./styles.css" />
  
  <title>Frontend Mentor | Results summary component</title>

  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <div class="container">

    <main>

      <article>

        <div class="result">

          <header>
            <h1 class="result__title">Your Result</h1>
          </header>

          <section class="points">
            <p class="result__score">
              <span class="result__score-value">76</span>
              <span class="result__score-max">of 100</span>
            </p>
          </section>

          <section class="evaluation-text">
            <h2 class="result__verdict">Great</h2>
            <p class="result__text">You scored higher than 65% of the people who have taken these tests.</p>
          </section>   

        </div>

      </article>

      <article>

        <div class="summary">

          <header>
            <h2 class="summary__title">Summary</h2>
          </header>

          <section>

            <ul class="summary__list">
              <li class="parameter parameter--reaction">
                  <img src="./assets/images/icon-reaction.svg" alt="" aria-hidden="true" class="parameter__icon" />
                  <span class="parameter__name">Reaction</span>
                  <span class="parameter__score">80 <span class="parameter__max">/ 100</span></span>
              </li>
              <li class="parameter parameter--memory">
                  <img src="./assets/images/icon-memory.svg" alt="" aria-hidden="true" class="parameter__icon"  />
                  <span class="parameter__name">Memory</span>
                  <span class="parameter__score">92 <span class="parameter__max">/ 100</span></span>
              </li>
              <li class="parameter parameter--verbal">
                  <img src="./assets/images/icon-verbal.svg" alt="" aria-hidden="true" class="parameter__icon"  />
                  <span class="parameter__name">Verbal</span>
                  <span class="parameter__score">61 <span class="parameter__max">/ 100</span></span>
              </li>
              <li class="parameter parameter--visual">
                  <img src="./assets/images/icon-visual.svg" alt="" aria-hidden="true" class="parameter__icon"  />
                  <span class="parameter__name">Visual</span>
                  <span class="parameter__score">73 <span class="parameter__max">/ 100</span></span>
              </li>
            </ul>

          </section>

          <button type="button" class="btn">Continue</button>

        </div>

      </article>

    </main>

  </div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Łukasz Nowak</a>.
  </footer>

</body>
</html>
